[project]
name = "eleicoes"
version = "0.1.0"
description = "Estudo de dados: Lulismo/Petismo × Bolsonarismo nas eleições presidenciais (2018, 2022, 2026)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "lxml>=6.1.3",
    "matplotlib>=3.10",
    "shapely>=2.1",
]

[project.scripts]
eleicoes = "eleicoes.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
